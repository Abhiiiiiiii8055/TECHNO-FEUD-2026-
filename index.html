<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techno Feud - The Ultimate Quiz Experience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    
    <div class="main-container">
        <header>
            <div class="logo">
                <h1>TECHNO<span>FEUD</span></h1>
            </div>
            <div class="difficulty-selector">
                <button id="easy-btn" class="diff-btn active">Easy</button>
                <button id="hard-btn" class="diff-btn">Hard</button>
            </div>
        </header>

        <main>
            <div class="game-board">
                <div class="question-container">
                    <h2 id="question-text">Loading question...</h2>
                </div>

                <div class="options-grid" id="options-grid">
                    <!-- Options will be injected here -->
                </div>
            </div>

            <div class="controls">
                <button id="prev-btn" class="control-btn" title="Previous Question">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                
                <button id="flip-all-btn" class="action-btn">Flip All Answers</button>

                <button id="next-btn" class="control-btn" title="Next Question">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </main>

        <footer>
            <div class="stats">
                <span id="question-counter">Question 1/0</span>
            </div>
        </footer>
    </div>

    <!-- Celebration Effect Area -->
    <div id="celebration-container"></div>

    <script src="script.js"></script>
</body>
</html>
